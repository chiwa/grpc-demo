# grpc-server/src/main/resources/application.yml
server:
  port: 8080  # สำหรับ Spring Boot HTTP (optional)

grpc:
  server:
    port: 9090

management:
  endpoints:
    web:
      exposure:
        include: health, info, prometheus
  metrics:
    export:
      prometheus:
        enabled: true
    tags:
      application: grpc-server