syntax = "proto3";

option java_multiple_files = true;
option java_package = "com.zengcode.grpc.chat";
option java_outer_classname = "ChatProto";

service ChatService {
  rpc chat(stream ChatMessage) returns (stream ChatMessage);
}

message ChatMessage {
  string clientId = 1;
  string content = 2;
  int64 timestamp = 3;
  bool isBroadcast = 4;
}