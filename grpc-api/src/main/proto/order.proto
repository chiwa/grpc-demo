syntax = "proto3";

option java_multiple_files = true;
option java_package = "com.zengcode.grpc.order";
option java_outer_classname = "OrderProto";

package order;

service OrderService {
  rpc ProcessOrders (stream OrderRequest) returns (OrderResponse);
}

message OrderRequest {
  string order_id = 1;
  string product = 2;
  int32 quantity = 3;
}

message OrderResponse {
  int32 total_orders = 1;
  string status = 2;
}